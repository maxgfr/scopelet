name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- bench
      - run: python3 scripts/check_skill.py --pack
      - run: python3 -m unittest discover -s bench -p 'test_*.py'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm install -g @maxgfr/codeindex@2.30.0
      - run: python3 scripts/install_ci_webindex.py "$RUNNER_TEMP/scopelet-adapters"
      - run: echo "$RUNNER_TEMP/scopelet-adapters" >> "$GITHUB_PATH"
      - run: python3 scripts/check_adapters.py target/debug/scopelet
      - run: cargo build --release --locked
      - run: python3 scripts/check_readme.py --binary target/release/scopelet
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with:
          toolchain: 1.88.0
      - run: cargo check --locked

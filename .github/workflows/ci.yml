name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- bench
      - run: python3 scripts/check_skill.py --pack
      - run: python3 -m unittest discover -s bench -p 'test_*.py'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm install -g @maxgfr/codeindex@2.30.0
      - run: python3 scripts/install_ci_webindex.py "$RUNNER_TEMP/scopelet-adapters"
      - run: echo "$RUNNER_TEMP/scopelet-adapters" >> "$GITHUB_PATH"
      - run: python3 scripts/check_adapters.py target/debug/scopelet
      - run: cargo build --release --locked
      - run: python3 scripts/check_readme.py --binary target/release/scopelet
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked

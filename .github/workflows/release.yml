name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  version:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: next
        name: Resolve next release without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release -- --dry-run
  binary:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set the resolved version before compilation
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/prepare_release.py "$RELEASE_VERSION"
      - run: node --test scripts/launcher.test.mjs
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: target/${{ matrix.target }}/release/scopelet bench
      - name: Verify the versioned launcher and all three host installations
        run: python3 scripts/check_install.py --binary target/${{ matrix.target }}/release/scopelet
      - name: Stage binary and observed version
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/scopelet" "dist/scopelet-$TARGET"
          "dist/scopelet-$TARGET" --version > "dist/scopelet-$TARGET.version"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [version, binary]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refuse publishing an outdated branch head
        env:
          BUILD_SHA: ${{ github.sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BUILD_SHA"
      - name: Release versioned binaries, skill and checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPELET_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: npm run release

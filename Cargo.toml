[package]
name = "scopelet"
version = "0.5.2"
edition = "2024"
rust-version = "1.88"
description = "Compute before you send: bounded evidence for coding agents"
license = "MIT"
repository = "https://github.com/maxgfr/scopelet"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
ignore = "0.4"
libc = "0.2"
memchr = "2"
regex = "1"
foldhash = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"

[profile.release]
# One codegen unit and fat LTO: a third smaller and a few percent faster on
# every call, for a slower release build nobody waits on interactively.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

